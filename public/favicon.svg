  <!-- Outer Gauge Ring -->
  <circle cx="32" cy="32" r="25" fill="#09090b" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Cardinal Index Ticks -->
  <line x1="32" y1="8" x2="32" y2="15" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="49" x2="32" y2="56" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="15" y2="32" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
  <line x1="49" y1="32" x2="56" y2="32" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>

  <!-- Bold White Jet Airplane (High Visibility at 16x16) -->
