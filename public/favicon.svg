<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <defs>
    <!-- Slate & Sky Blue Aviation Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Slate Base Card -->
  <rect width="64" height="64" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- Compass Rose & Range Rings -->
  <circle cx="32" cy="27" r="22" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3" opacity="0.45"/>
  <circle cx="32" cy="27" r="14" fill="none" stroke="#64748b" stroke-width="0.8" opacity="0.4"/>

  <!-- Airport / Waypoint Pin Marker -->
  <path d="M32 6 C20 6 11 15 11 27 C11 41 32 60 32 60 C32 60 53 41 53 27 C53 15 44 6 32 6 Z"
        fill="url(#skyGrad)"
        stroke="#f8fafc"
        stroke-width="1.75"
        filter="url(#shadow)"/>

  <!-- Inner Dial -->
  <circle cx="32" cy="26" r="11" fill="#0f172a" stroke="#bae6fd" stroke-width="1.25"/>

  <!-- Crisp Aircraft Silhouette -->
  <path d="M32 17 L34.5 23 L41 27 L41 29 L34.5 27.5 L34 32.5 L36.5 35 L36.5 36.5 L32 35.5 L27.5 36.5 L27.5 35 L30 32.5 L29.5 27.5 L23 29 L23 27 L29.5 23 Z"
        fill="#38bdf8"
        stroke="#e0f2fe"
        stroke-width="0.4"/>
</svg>
